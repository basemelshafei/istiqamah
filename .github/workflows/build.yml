name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Tests (night calculation + screen)
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Keep screenshots of every screen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: app/build/screenshots/
          if-no-files-found: ignore

      - name: Keep test reports if anything failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: app/build/test-results/

      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Istiqamah.apk
          (cd app/build/screenshots && zip -q -r ../../../screenshots.zip .) || true

      - uses: actions/upload-artifact@v4
        with:
          name: Istiqamah-apk
          path: Istiqamah.apk

      - name: Publish as a release (easy to download on the phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Istiqamah build ${{ github.run_number }}
          make_latest: true
          files: |
            Istiqamah.apk
            screenshots.zip
          body: |
            Install: open this page on your phone, tap **Istiqamah.apk**, then allow "Install unknown apps" for your browser.
            Updates install over the previous version and keep your streak and settings.
